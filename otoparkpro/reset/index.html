<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yeni şifre — OtoparkPro</title>
<meta name="robots" content="noindex">
<meta name="description" content="OtoparkPro hesabın için yeni şifre belirle.">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png">
<meta name="theme-color" content="#1E3A8A">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#F1F5FB;color:#0F172A;
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{background:#fff;border-radius:20px;padding:36px 30px;border:1px solid #E0E7F4;max-width:420px;width:100%;
        box-shadow:0 10px 30px rgba(15,42,110,.10)}
  .logo{width:64px;height:64px;border-radius:15px;display:block;margin:0 auto 16px}
  h1{font-size:21px;font-weight:800;margin-bottom:6px;text-align:center}
  p.sub{font-size:14px;color:#64748B;line-height:1.5;text-align:center;margin-bottom:20px}
  label{display:block;font-size:13px;font-weight:600;color:#334155;margin:12px 0 6px}
  input{width:100%;padding:13px 14px;border:1.5px solid #CBD5E1;border-radius:12px;font-size:16px}
  input:focus{outline:none;border-color:#1D4ED8}
  button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:#1D4ED8;color:#fff;
         font-size:16px;font-weight:700;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  .msg{margin-top:14px;font-size:14px;line-height:1.5;text-align:center;display:none}
  .msg.err{color:#B91C1C;display:block}
  .msg.ok{color:#047857;display:block}
  .done{text-align:center;display:none}
  .tick{width:64px;height:64px;border-radius:50%;background:#D1FAE5;display:flex;align-items:center;
        justify-content:center;font-size:32px;margin:0 auto 14px}
</style>
</head>
<body>
<div class="card">
  <img class="logo" src="/otoparkpro/icon.png" alt="OtoparkPro">
  <div id="form">
    <h1 data-i="title"></h1>
    <p class="sub" data-i="sub"></p>
    <label for="p1" data-i="l1"></label>
    <input id="p1" type="password" autocomplete="new-password" minlength="8">
    <label for="p2" data-i="l2"></label>
    <input id="p2" type="password" autocomplete="new-password" minlength="8">
    <button id="go" data-i="btn"></button>
    <p class="msg" id="msg"></p>
  </div>
  <div class="done" id="done">
    <div class="tick">✓</div>
    <h1 data-i="doneTitle"></h1>
    <p class="sub" data-i="doneSub"></p>
  </div>
</div>
<script src="/otoparkpro/page-i18n.js"></script>
<script>
// OtoparkPro Supabase projesi; anahtar istemciye acik turden
// (uygulamada da gomulu). Sifre buradan Supabase'e HTTPS ile gider,
// bu sayfa veya site hicbir sey saklamaz.
const SUPA = 'https://itjslckrcplrbjurwvtz.supabase.co';
const KEY  = 'sb_publishable_xBlCzeWSSb2Np9pToL-y7w_9L6SRLLj';

// Ceviriler ortak dosyada: /otoparkpro/page-i18n.js (27 dil).
const q = new URLSearchParams(location.search);
const lang = (q.get('lang') || navigator.language || 'en').slice(0,2);
const L = (PAGE_I18N[lang] || PAGE_I18N.en).reset;
document.documentElement.lang = PAGE_I18N[lang] ? lang : 'en';
document.querySelectorAll('[data-i]').forEach(
    el => { el.textContent = L[el.getAttribute('data-i')] ?? el.textContent; });

// Supabase dogrulama ucundan #access_token=...&type=recovery ile gelinir.
const frag = new URLSearchParams((location.hash || '').replace(/^#/, ''));
const access = frag.get('access_token');
const msg = document.getElementById('msg');
if (!access) { msg.className = 'msg err'; msg.textContent = L.expired; document.getElementById('go').disabled = true; }

document.getElementById('go').addEventListener('click', async () => {
  const p1 = document.getElementById('p1').value;
  const p2 = document.getElementById('p2').value;
  msg.className = 'msg'; msg.textContent = '';
  if (p1.length < 8) { msg.className='msg err'; msg.textContent = L.short; return; }
  if (p1 !== p2) { msg.className='msg err'; msg.textContent = L.mismatch; return; }
  const b = document.getElementById('go'); b.disabled = true;
  try {
    const r = await fetch(SUPA + '/auth/v1/user', {
      method: 'PUT',
      headers: {'apikey': KEY, 'Authorization': 'Bearer ' + access,
                'Content-Type': 'application/json'},
      body: JSON.stringify({password: p1}),
    });
    if (!r.ok) {
      const e = await r.json().catch(() => ({}));
      const m = (e.msg || e.message || e.error_description || ('HTTP ' + r.status));
      msg.className='msg err';
      msg.textContent = /expired|invalid|jwt/i.test(m) ? L.expired : (L.fail + m);
      b.disabled = false; return;
    }
    document.getElementById('form').style.display = 'none';
    document.getElementById('done').style.display = 'block';
  } catch (e) {
    msg.className='msg err'; msg.textContent = L.fail + e; b.disabled = false;
  }
});
</script>
</body>
</html>
