<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aracım — OtoparkPro</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<meta name="theme-color" content="#1E3A8A">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
       background:#F1F5FB;color:#0F172A;min-height:100vh;display:flex;
       align-items:center;justify-content:center;padding:20px}
  .card{background:#fff;border-radius:20px;padding:32px 28px;max-width:420px;
        width:100%;border:1px solid #E0E7F4;
        box-shadow:0 10px 30px rgba(15,42,110,.10);text-align:center}
  .logo{width:56px;height:56px;border-radius:13px;margin:0 auto 14px;display:block}
  .plate{display:inline-block;border:2.5px solid #0F172A;border-radius:8px;
         padding:6px 16px;font-weight:800;font-size:22px;letter-spacing:2px;
         margin-bottom:6px;background:#fff}
  .lot{color:#64748B;font-size:14px;margin-bottom:20px}
  .big{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums}
  .biglabel{font-size:12px;letter-spacing:.15em;color:#64748B;font-weight:700}
  .grid{display:flex;gap:10px;margin:18px 0}
  .cell{flex:1;background:#F1F5FB;border-radius:14px;padding:14px 8px}
  .done{color:#047857}
  .note{font-size:13px;color:#64748B;line-height:1.5;margin-top:14px}
  #err{color:#B91C1C;font-size:15px;line-height:1.5;display:none}
</style>
</head>
<body>
<div class="card">
  <img class="logo" src="/otoparkpro/icon.png" alt="OtoparkPro">
  <div id="content" style="display:none">
    <div class="plate" id="plate"></div>
    <div class="lot" id="lot"></div>
    <div class="grid">
      <div class="cell"><div class="biglabel" id="l-in"></div>
        <div class="big" id="entry" style="font-size:26px"></div></div>
      <div class="cell"><div class="biglabel" id="l-dur"></div>
        <div class="big" id="dur" style="font-size:26px"></div></div>
    </div>
    <div class="biglabel" id="l-fee"></div>
    <div class="big" id="fee">—</div>
    <div class="note" id="note"></div>
  </div>
  <div id="err"></div>
</div>
<script src="/otoparkpro/fee.js"></script>
<script src="/otoparkpro/page-i18n.js"></script>
<script>
// Makbuz sayfasi: fisteki QR buraya acilir (?t=<jeton>).
// Musteri aracinin giris saatini ve ISLEYEN ucreti canli gorur;
// arac cikmissa kesinlesen ucret gosterilir. Jeton yalniz bu tek
// kaydi acar — plakalar toplu halde asla disari cikmaz.
const SUPA = 'https://itjslckrcplrbjurwvtz.supabase.co';
const KEY  = 'sb_publishable_xBlCzeWSSb2Np9pToL-y7w_9L6SRLLj';

const q = new URLSearchParams(location.search);
const lang = (q.get('lang') || navigator.language || 'tr').slice(0,2);
// Ceviriler ortak dosyada: /otoparkpro/page-i18n.js (27 dil).
const L = (PAGE_I18N[lang] || PAGE_I18N.en).izle;
document.getElementById('l-in').textContent = L.en;
document.getElementById('l-dur').textContent = L.dur;

let data = null;

function fmtDur(mins){
  const h = Math.floor(mins/60), m = mins%60;
  return (h ? h + L.hours : '') + m + L.mins;
}

function render(){
  if (!data) return;
  const entry = new Date(data.entry_time);
  const end = data.exit_time ? new Date(data.exit_time) : new Date();
  const mins = Math.max(0, Math.floor((end - entry)/60000));
  document.getElementById('entry').textContent =
      entry.toLocaleTimeString(lang==='tr'?'tr-TR':'en-GB',
          {hour:'2-digit',minute:'2-digit'});
  document.getElementById('dur').textContent = fmtDur(mins);
  const closed = data.status === 'closed';
  document.getElementById('l-fee').textContent = closed ? L.feeDone : L.fee;
  let fee = closed ? data.fee_kurus : otoparkFeeKurus(mins, data.tariff);
  document.getElementById('fee').textContent =
      fee == null ? '—' : kurusToTl(fee);
  if (closed) document.getElementById('fee').classList.add('done');
  document.getElementById('note').textContent =
      closed ? L.noteDone : L.note;
}

async function load(){
  try{
    const r = await fetch(`${SUPA}/rest/v1/rpc/public_session`, {
      method:'POST',
      headers:{apikey:KEY,'Content-Type':'application/json'},
      body: JSON.stringify({p_token: q.get('t')}),
    });
    const d = await r.json();
    if (!d || !d.entry_time) throw 0;
    data = d;
    document.getElementById('plate').textContent = d.plate;
    document.getElementById('lot').textContent = d.branch_name || '';
    document.getElementById('content').style.display='block';
    render();
  }catch(e){
    const err = document.getElementById('err');
    err.style.display='block'; err.textContent = L.err;
  }
}
load();
setInterval(render, 30000);       // sure/ucret canli aksin
setInterval(load, 5*60000);       // cikis yapildiysa yakala
</script>
</body>
</html>
