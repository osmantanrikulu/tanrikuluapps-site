<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E-posta doğrulandı — Tanrikulu Apps</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✅</text></svg>">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#F2F7F9;color:#0F172A;
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{background:#fff;border-radius:20px;padding:40px 32px;border:1px solid #E2EDF1;max-width:400px;text-align:center;
        box-shadow:0 10px 30px rgba(7,58,76,.10)}
  .tick{width:72px;height:72px;border-radius:50%;background:#D1FAE5;display:flex;align-items:center;justify-content:center;
        font-size:36px;margin:0 auto 18px}
  h1{font-size:22px;font-weight:800;margin-bottom:8px}
  p{font-size:15px;color:#64748B;line-height:1.55}
</style>
</head>
<body>
<div class="card">
  <div class="tick">✓</div>
  <h1>E-postan doğrulandı</h1>
  <p>Hesabın hazır. Bu sayfayı kapatıp uygulamaya dönebilir ve giriş yapabilirsin.</p>
</div>
</body>
</html>
