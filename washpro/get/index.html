<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:linear-gradient(160deg,#0E7490,#155E75);
       color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center}
  .wrap{max-width:380px}
  .logo{font-size:64px;margin-bottom:10px}
  h1{font-size:26px;font-weight:800;margin-bottom:6px}

  .btn{display:block;background:#fff;color:#0E7490;text-decoration:none;font-weight:800;font-size:15px;
       padding:15px 20px;border-radius:14px;margin-bottom:12px}

</style>

<body>
<div class="wrap">
  <div class="logo">💧</div>
  <h1>WashPro</h1>
  <p data-i18n="get.tag">Araç yıkama işletmeni cebinden yönet: kuyruk panosu, plaka okuma, sadakat kartı, tahmini teslim saati.</p>
  <div id="links">
    <p style="opacity:.9;font-weight:700" data-i18n="get.soon">Çok yakında App Store ve Google Play'de!</p>
  </div>
  <div class="muted">tanrikuluapps.com</div>
</div>
<script src="/i18n.js" data-cfasync="false"></script>
<!-- data-cfasync: Cloudflare Rocket Loader inline script'leri
     asenkron calistirip sirayi bozuyor; uygulayici sozlukten
     once kosunca sayfa Turkce kaliyordu. -->
<script data-cfasync="false">
(function(){
  // Ana sayfayla ayni sozlugu kullanir; secim yok, tarayicinin dili
  // algilanir (Osman'in karari: 27 dil arasindan sectirmek yerine
  // dogru dilde acilsin). ?lang= ve onceki secim yine gecerli.
  // DIKKAT: i18n.js sozlugu `const I18N` ile tanimliyor; ust duzey
  // const/let window'a YAZILMAZ. `window.I18N` her zaman undefined
  // doner — ciplak I18N kullanilmali (ana sayfa da oyle yapiyor).
  var SUP = (typeof I18N === 'undefined') ? [] : Object.keys(I18N);
  var RTL = ['ar','fa','he','ur'];
  function pick(){
    var q = new URLSearchParams(location.search).get('lang');
    if (q && SUP.indexOf(q) >= 0) return q;
    try { var st = localStorage.getItem('lang');
          if (st && SUP.indexOf(st) >= 0) return st; } catch(e){}
    var nav = (navigator.languages || [navigator.language || 'en']);
    for (var i = 0; i < nav.length; i++) {
      var c = String(nav[i]).slice(0,2).toLowerCase();
      if (SUP.indexOf(c) >= 0) return c;
    }
    return 'en';
  }
  function apply(){
    if (typeof I18N === 'undefined') return;  // sozluk yoksa Turkce kalir
    var lang = pick();
    var d = I18N[lang] || I18N.en;
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      var v = d[el.dataset.i18n]; if (v) el.textContent = v;
    });
    if (d['get.title']) document.title = d['get.title'];
    var md = document.querySelector('meta[name="description"]');
    if (md && d['get.tag']) md.setAttribute('content', d['get.tag']);
    document.documentElement.lang = lang;
    document.documentElement.dir = RTL.indexOf(lang) >= 0 ? 'rtl' : 'ltr';
  }
  // i18n.js hemen yukarida SENKRON yuklendi, sozluk kesin hazir.
  // (Once 'defer' kullanilmisti; sira garantisi olmadigi icin
  // uygulayici sozluk gelmeden calisip sessizce vazgeciyordu.)
  apply();
})();
</script>
<script>
  // Magaza linkleri yayimlaninca doldurulacak; dolunca cihaza gore
  // otomatik yonlendirir, ikisi de doluysa dogru olanina gider.
  const APP_STORE = '';   // ör: https://apps.apple.com/app/id0000000000
  const PLAY_STORE = '';  // ör: https://play.google.com/store/apps/details?id=com.washpro.washpro

  // DOMContentLoaded bekleniyor: i18n.js "defer" ile yukleniyor ve
  // sayfa cizilirken henuz calismamis oluyor. Butonlar burada
  // uretildigi icin metinleri sozlukten alabilmek sart.
  document.addEventListener('DOMContentLoaded', function () {
    const ua = navigator.userAgent;
    const isIOS = /iPhone|iPad|iPod/.test(ua);
    const isAndroid = /Android/.test(ua);
    const target = isIOS ? APP_STORE : isAndroid ? PLAY_STORE : '';

    if (target) {
      location.replace(target);
      return;
    }
    if (!APP_STORE && !PLAY_STORE) return;

    // Masaustu veya bilinmeyen cihaz: buton goster.
    const dict =
      (window.I18N && (I18N[document.documentElement.lang] || I18N.en)) || {};
    const links = document.getElementById('links');
    links.innerHTML = '';
    if (APP_STORE) links.innerHTML +=
      `<a class="btn" href="${APP_STORE}"> ${dict['get.ios'] || "App Store'dan indir"}</a>`;
    if (PLAY_STORE) links.innerHTML +=
      `<a class="btn" href="${PLAY_STORE}">▶ ${dict['get.android'] || "Google Play'den indir"}</a>`;
  });
</script>

</body>
</html>
